<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>항만 도로 특성 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --ink: #12202b;
    --panel: #0f1e28;
    --panel-2: #16303f;
    --line: #26414f;
    --paper: #eef2f0;
    --muted: #6f8592;
    --accent: #ff8a3d;
    --accent-2: #35c2b8;
    --accent-3: #f2c14e;
    --warn: #e0703f;
    --text-on-dark: #dce8ee;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body{
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
  }
  #app{ display: grid; grid-template-columns: 336px 1fr; height: 100vh; }
  #sidebar{
    background: var(--panel);
    color: var(--text-on-dark);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    z-index: 10;
    overflow-y: auto;
  }
  .brand{ padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
  .brand .eyebrow{
    font-size: 10.5px; letter-spacing: 0.14em; color: var(--accent-2);
    text-transform: uppercase; font-weight: 700; margin-bottom: 6px;
  }
  .brand h1{ font-size: 17px; margin: 0; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em; }
  .brand p{ margin: 8px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }

  .tabs{ display:flex; gap:6px; padding: 14px 20px 0; }
  .tab{
    flex:1; text-align:center; padding: 8px 6px; border-radius: 7px;
    font-size: 12.5px; font-weight:600; cursor:pointer; color: var(--muted);
    border: 1px solid var(--line); background: transparent;
    font-family: inherit;
  }
  .tab.active{ background: var(--panel-2); color: #fff; border-color: var(--accent-2); }

  .section{ padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .section-title{
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); font-weight: 700; margin: 0 0 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap: 6px; }
  .chip{
    padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight:600;
    border: 1px solid var(--line); background: transparent; color: var(--text-on-dark);
    cursor:pointer; font-family: inherit; position:relative;
  }
  .chip:hover{ background: rgba(255,255,255,0.05); }
  .chip.active{ background: var(--accent-2); border-color: var(--accent-2); color:#062421; }
  .chip.disabled{ opacity: 0.4; cursor: not-allowed; }
  .chip .soon{ font-size: 9.5px; color: var(--muted); margin-left: 4px; }
  .chip .warn-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--warn); margin-left: 5px; vertical-align: middle;
  }

  .metric-select{ display: flex; flex-direction: column; gap: 6px; }
  .metric-btn{
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: transparent; border: 1px solid var(--line); color: var(--text-on-dark);
    padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: background .12s ease, border-color .12s ease;
  }
  .metric-btn .dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--muted); }
  .metric-btn:hover{ background: rgba(255,255,255,0.04); }
  .metric-btn.active{ background: var(--panel-2); border-color: var(--accent-2); }
  .metric-btn .sub{ margin-left: auto; font-size: 10.5px; color: var(--muted); }

  .warn-box{
    margin-top: 10px; padding: 9px 10px; border-radius: 7px;
    background: rgba(224,112,63,0.12); border: 1px solid rgba(224,112,63,0.4);
    font-size: 11.5px; line-height: 1.5; color: #f0c4ac;
  }

  #legend{ display: flex; flex-direction: column; gap: 6px; }
  .legend-row{
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    color: var(--text-on-dark); font-variant-numeric: tabular-nums;
  }
  .swatch{ width: 22px; height: 6px; border-radius: 3px; flex-shrink: 0; }
  .legend-row.na .swatch{ background: repeating-linear-gradient(45deg, #3a4b55, #3a4b55 3px, #26414f 3px, #26414f 6px); }

  #stats{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-box{ background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat-box .num{ font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff; }
  .stat-box .lbl{ font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  #footer-note{
    margin-top: auto; padding: 14px 20px 18px; font-size: 11px;
    color: var(--muted); line-height: 1.6; border-top: 1px solid var(--line);
  }

  #map{ width: 100%; height: 100%; background: #dbe6e2; }
  .leaflet-popup-content-wrapper{
    background: var(--panel); color: var(--text-on-dark); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .leaflet-popup-tip{ background: var(--panel); }
  .leaflet-popup-content{ margin: 14px 16px; width: 280px !important; }
  .popup-road{ font-size: 15px; font-weight: 700; margin-bottom: 2px; color: #fff; }
  .popup-id{ font-size: 10.5px; color: var(--muted); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .popup-section-title{
    font-size: 10.5px; text-transform: uppercase; letter-spacing:0.06em;
    color: var(--muted); margin: 10px 0 6px; font-weight:700;
  }
  .popup-grid{ display: grid; grid-template-columns: 1fr auto; row-gap: 6px; font-size: 12.5px; }
  .popup-grid .k{ color: var(--muted); }
  .popup-grid .v{ font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-on-dark); }
  .popup-grid .v.hl{ color: var(--accent-3); }
  .popup-compare{ display:grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 4px 8px; font-size: 11.5px; margin-top:2px; }
  .popup-compare .h{ color: var(--muted); font-weight:700; font-size:10.5px; }
  .popup-compare .rowlabel{ color: var(--muted); }
  .popup-compare .cell{ text-align:right; font-variant-numeric: tabular-nums; }
  .popup-compare .cell.cur{ color: var(--accent-3); font-weight:700; }
  .popup-empty{ font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

  .leaflet-control-attribution{ font-size: 10px; }

  #loading{
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--paper); font-size: 13px; color: var(--muted); z-index: 999;
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand">
      <div class="eyebrow">Port Road Network</div>
      <h1>부산항 도로별<br/>GPS 특성 지도</h1>
      <p>표준노드링크에 매칭된 시나리오별 GPS 통계를 도로 구간 색상으로 확인하세요.</p>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-gps">GPS 통계</button>
      <button class="tab" id="tab-structure">도로 구조</button>
      <button class="tab" id="tab-routes">주요 이동 경로</button>
    </div>

    <div id="panel-gps">
      <div class="section">
        <div class="section-title">시나리오</div>
        <div class="chip-row" id="scenario-select"></div>
        <div class="warn-box" id="scenario-warning" style="display:none;"></div>
      </div>
      <div class="section">
        <div class="section-title">항목</div>
        <div class="chip-row" id="field-select"></div>
      </div>
    </div>

    <div id="panel-structure" style="display:none;">
      <div class="section">
        <div class="section-title">색상 기준</div>
        <div class="metric-select" id="struct-select"></div>
      </div>
    </div>

    <div id="panel-routes" style="display:none;">
      <div class="section">
        <div class="section-title">터미널</div>
        <div class="chip-row" id="terminal-select"></div>
        <div class="warn-box" id="terminal-empty" style="display:none;">이 터미널은 아직 경로 데이터가 없습니다. 데이터가 준비되면 알려주세요 — 바로 추가해드릴게요.</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title" id="legend-heading">범례</div>
      <div id="legend"></div>
    </div>

    <div class="section" style="border-bottom:none;">
      <div class="section-title">요약</div>
      <div id="stats"></div>
    </div>

    <div id="footer-note">
      데이터 없는 구간은 회색 점선으로 표시됩니다. 도로를 클릭하면 4개 시나리오 값을 함께 비교할 수 있습니다.
    </div>
  </div>
  <div style="position:relative;">
    <div id="loading">지도 불러오는 중…</div>
    <div id="map"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- 정의 ----------
const SCENARIOS = [
  { key: 'total',   label: '전체' },
  { key: 'export',  label: '수출' },
  { key: 'import',  label: '수입' },
  { key: 'shuttle', label: '셔틀', warn: '셔틀 시나리오 값이 현재 전체(Total) 값과 동일합니다. QGIS에서 셔틀 전용으로 내보내신 파일이 맞는지 한 번 확인해주세요.' }
];
const FIELDS = [
  { key: 'vehicle_count',  label: '평균 교통량', unit: '대',
    ramp: ['#1f4f5c', '#2e7f7a', '#7fc07a', '#f2c14e', '#ff8a3d'], format: v => Math.round(v).toLocaleString() },
  { key: 'avg_speed',      label: '평균 주행속도', unit: 'km/h',
    ramp: ['#c0392b', '#e67e22', '#f2c14e', '#7fc8a9', '#35c2b8'], format: v => v.toFixed(1) },
  { key: 'sum_weight_kg',  label: '합계 물동량', unit: 'kg',
    ramp: ['#1f4f5c', '#2e7f7a', '#7fc07a', '#f2c14e', '#ff8a3d'], format: v => Math.round(v).toLocaleString() }
];
const STRUCT_METRICS = [
  {
    key: 'ROAD_RANK', label: '도로 등급', accent: '#8ec6f0', categorical: true,
    categories: {
      '101': { label: '고속국도', color: '#e63946' },
      '103': { label: '일반국도', color: '#f2934d' },
      '104': { label: '특별/광역시도', color: '#f2c14e' },
      '105': { label: '시/군도', color: '#7fc8a9' },
      '107': { label: '기타(단지 내)', color: '#8ec6f0' }
    }
  },
  {
    key: 'LANES', label: '차로 수', accent: '#a892d6', categorical: true,
    categories: { 2: { label: '2차로', color: '#8ec6f0' }, 3: { label: '3차로', color: '#a892d6' }, 4: { label: '4차로', color: '#e6739b' } }
  }
];

const TERMINALS = [
  { key: 'PNC',   label: 'PNC',   file: null },
  { key: 'BNCT',  label: 'BNCT',  file: null },
  { key: 'PNIT',  label: 'PNIT',  file: null },
  { key: 'HPNT',  label: 'HPNT',  file: null },
  { key: 'DGT',   label: 'DGT',   file: './data-dgt.geojson' },
  { key: 'BCT',   label: 'BCT',   file: null },
  { key: 'HJNC',  label: 'HJNC',  file: null }
];
const ROUTE_RAMP = ['#1f4f5c', '#2e7f7a', '#7fc07a', '#f2c14e', '#ff8a3d'];

let mode = 'gps'; // 'gps' | 'structure' | 'routes'
let currentScenario = 0;
let currentField = 0;
let currentStruct = 0;
let currentTerminal = null;
let geoLayer = null;
let routeLayer = null;
let allFeatures = [];
const routeDataCache = {};

function quantileBins(values, n){
  const sorted = [...values].sort((a,b)=>a-b);
  const bins = [];
  for(let i=1;i<n;i++) bins.push(sorted[Math.floor(sorted.length * i / n)]);
  return bins;
}

function propKey(){ return `${SCENARIOS[currentScenario].key}_${FIELDS[currentField].key}`; }

function computeAllBins(){
  SCENARIOS.forEach(sc => {
    FIELDS.forEach(fl => {
      const k = `${sc.key}_${fl.key}`;
      const vals = allFeatures.map(f => f.properties[k]).filter(v => v !== null && v !== undefined);
      fl._bins = fl._bins || {};
      fl._range = fl._range || {};
      fl._bins[sc.key] = quantileBins(vals, fl.ramp.length);
      fl._range[sc.key] = [vals.length ? Math.min(...vals) : 0, vals.length ? Math.max(...vals) : 0];
    });
  });
  STRUCT_METRICS.forEach(m => { /* categorical, no bins needed */ });
}

function getGpsColor(props){
  const k = propKey();
  const val = props[k];
  if(val === null || val === undefined) return null;
  const fl = FIELDS[currentField];
  const bins = fl._bins[SCENARIOS[currentScenario].key];
  let idx = bins.findIndex(b => val <= b);
  if(idx === -1) idx = fl.ramp.length - 1;
  return fl.ramp[idx];
}

function getStructColor(props){
  const m = STRUCT_METRICS[currentStruct];
  const val = props[m.key];
  if(val === null || val === undefined) return null;
  const cat = m.categories[val];
  return cat ? cat.color : '#4a5f6a';
}

function currentColorFn(){ return mode === 'gps' ? getGpsColor : getStructColor; }

// ---------- 지도 초기화 ----------
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([35.09, 128.83], 13);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO', maxZoom: 19
}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
  attribution: '', maxZoom: 19, pane: 'shadowPane'
}).addTo(map);

const ROAD_RANK_LABEL = { '101': '고속국도', '103': '일반국도', '104': '특별/광역시도', '105': '시/군도', '107': '기타(단지 내도로)' };

function popupHtml(props){
  const fl = FIELDS[currentField];
  const baseRows = [
    ['도로 등급', ROAD_RANK_LABEL[props.ROAD_RANK] || props.ROAD_RANK || '-'],
    ['차로 수', props.LANES != null ? props.LANES + '차로' : '-'],
    ['제한속도', props.MAX_SPD != null ? props.MAX_SPD + ' km/h' : '-'],
    ['링크 길이', props.LENGTH != null ? Math.round(props.LENGTH).toLocaleString() + ' m' : '-']
  ];
  const baseGrid = baseRows.map(([k,v]) => `<div class="k">${k}</div><div class="v">${v}</div>`).join('');

  const anyStats = SCENARIOS.some(sc => props[`${sc.key}_${fl.key}`] != null);
  let compareHtml = '';
  if(anyStats){
    const header = `<div class="h"></div>` + SCENARIOS.map((sc,i) => `<div class="h" style="text-align:right;">${sc.label}</div>`).join('');
    const rows = FIELDS.map(f => {
      const cells = SCENARIOS.map((sc,i) => {
        const v = props[`${sc.key}_${f.key}`];
        const isCur = (i === currentScenario && f.key === fl.key);
        const text = v != null ? f.format(v) : '–';
        return `<div class="cell${isCur ? ' cur' : ''}">${text}</div>`;
      }).join('');
      return `<div class="rowlabel">${f.label}</div>${cells}`;
    }).join('');
    compareHtml = `
      <div class="popup-section-title">시나리오 비교</div>
      <div class="popup-compare">${header}${rows}</div>
    `;
  }

  return `
    <div class="popup-road">${props.ROAD_NAME || '(도로명 없음)'}</div>
    <div class="popup-id">LINK_ID ${props.LINK_ID}</div>
    <div class="popup-grid">${baseGrid}</div>
    ${anyStats ? compareHtml : '<div class="popup-empty">이 구간은 매칭된 GPS 데이터가 없습니다.</div>'}
  `;
}

function styleForFeature(feature){
  const color = currentColorFn()(feature.properties);
  if(color === null) return { color: '#9fb0b7', weight: 2, opacity: 0.6, dashArray: '2,5' };
  return { color, weight: 4, opacity: 0.9 };
}

function renderLayer(){
  if(geoLayer) map.removeLayer(geoLayer);
  if(routeLayer){ map.removeLayer(routeLayer); routeLayer = null; }
  geoLayer = L.geoJSON({ type: 'FeatureCollection', features: allFeatures }, {
    style: styleForFeature,
    onEachFeature: (feature, layer) => {
      layer.bindPopup(popupHtml(feature.properties));
      layer.on('mouseover', () => layer.setStyle({ weight: 7 }));
      layer.on('mouseout', () => layer.setStyle(styleForFeature(feature)));
    }
  }).addTo(map);
}

function renderLegend(){
  const el = document.getElementById('legend');
  el.innerHTML = '';
  if(mode === 'routes'){
    document.getElementById('legend-heading').textContent = '범례 · 주요 이동 경로';
    if(!currentTerminal){
      el.innerHTML = '<div class="legend-row"><div>터미널을 선택하면 범례가 표시됩니다.</div></div>';
    }
    return;
  }
  if(mode === 'gps'){
    const fl = FIELDS[currentField];
    const sc = SCENARIOS[currentScenario];
    document.getElementById('legend-heading').textContent = `범례 · ${sc.label} · ${fl.label}`;
    const [min, max] = fl._range[sc.key];
    const bins = fl._bins[sc.key];
    const edges = [min, ...bins, max];
    fl.ramp.forEach((color, i) => {
      const row = document.createElement('div');
      row.className = 'legend-row';
      row.innerHTML = `<div class="swatch" style="background:${color}"></div><div>${fl.format(edges[i])} – ${fl.format(edges[i+1])} ${fl.unit}</div>`;
      el.appendChild(row);
    });
  } else {
    const m = STRUCT_METRICS[currentStruct];
    document.getElementById('legend-heading').textContent = `범례 · ${m.label}`;
    Object.values(m.categories).forEach(cat => {
      const row = document.createElement('div');
      row.className = 'legend-row';
      row.innerHTML = `<div class="swatch" style="background:${cat.color}"></div><div>${cat.label}</div>`;
      el.appendChild(row);
    });
  }
  const naRow = document.createElement('div');
  naRow.className = 'legend-row na';
  naRow.innerHTML = `<div class="swatch"></div><div>데이터 없음</div>`;
  el.appendChild(naRow);
}

function renderScenarioChips(){
  const el = document.getElementById('scenario-select');
  el.innerHTML = '';
  SCENARIOS.forEach((sc,i) => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (i === currentScenario ? ' active' : '');
    btn.innerHTML = sc.label + (sc.warn ? '<span class="warn-dot"></span>' : '');
    btn.addEventListener('click', () => {
      currentScenario = i;
      renderScenarioChips();
      const warnBox = document.getElementById('scenario-warning');
      if(sc.warn){ warnBox.style.display='block'; warnBox.textContent = '⚠ ' + sc.warn; }
      else { warnBox.style.display='none'; }
      renderLegend(); renderLayer();
    });
    el.appendChild(btn);
  });
}

function renderFieldChips(){
  const el = document.getElementById('field-select');
  el.innerHTML = '';
  FIELDS.forEach((fl,i) => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (i === currentField ? ' active' : '');
    btn.textContent = fl.label;
    btn.addEventListener('click', () => {
      currentField = i;
      renderFieldChips();
      renderLegend(); renderLayer();
    });
    el.appendChild(btn);
  });
}

function renderStructButtons(){
  const el = document.getElementById('struct-select');
  el.innerHTML = '';
  STRUCT_METRICS.forEach((m,i) => {
    const btn = document.createElement('button');
    btn.className = 'metric-btn' + (i === currentStruct ? ' active' : '');
    btn.innerHTML = `<span class="dot" style="background:${m.accent}"></span><span>${m.label}</span>`;
    btn.addEventListener('click', () => {
      currentStruct = i;
      renderStructButtons();
      renderLegend(); renderLayer();
    });
    el.appendChild(btn);
  });
}

document.getElementById('tab-gps').addEventListener('click', () => {
  mode = 'gps';
  setActiveTab('tab-gps');
  document.getElementById('panel-gps').style.display = 'block';
  document.getElementById('panel-structure').style.display = 'none';
  document.getElementById('panel-routes').style.display = 'none';
  renderLegend(); renderLayer();
});
document.getElementById('tab-structure').addEventListener('click', () => {
  mode = 'structure';
  setActiveTab('tab-structure');
  document.getElementById('panel-gps').style.display = 'none';
  document.getElementById('panel-structure').style.display = 'block';
  document.getElementById('panel-routes').style.display = 'none';
  renderLegend(); renderLayer();
});
document.getElementById('tab-routes').addEventListener('click', () => {
  mode = 'routes';
  setActiveTab('tab-routes');
  document.getElementById('panel-gps').style.display = 'none';
  document.getElementById('panel-structure').style.display = 'none';
  document.getElementById('panel-routes').style.display = 'block';
  renderLegend();
  if(currentTerminal) loadAndRenderRoute(currentTerminal); else clearMainLayers();
});
function setActiveTab(id){
  ['tab-gps','tab-structure','tab-routes'].forEach(t => document.getElementById(t).classList.toggle('active', t===id));
}
function clearMainLayers(){
  if(geoLayer){ map.removeLayer(geoLayer); geoLayer = null; }
  if(routeLayer){ map.removeLayer(routeLayer); routeLayer = null; }
}

function renderTerminalChips(){
  const el = document.getElementById('terminal-select');
  el.innerHTML = '';
  TERMINALS.forEach(t => {
    const btn = document.createElement('button');
    const enabled = !!t.file;
    btn.className = 'chip' + (enabled ? '' : ' disabled') + (currentTerminal === t.key ? ' active' : '');
    btn.innerHTML = t.label + (enabled ? '' : '<span class="soon">준비중</span>');
    if(enabled){
      btn.addEventListener('click', () => {
        currentTerminal = t.key;
        renderTerminalChips();
        document.getElementById('terminal-empty').style.display = 'none';
        loadAndRenderRoute(t.key);
      });
    } else {
      btn.addEventListener('click', () => {
        document.getElementById('terminal-empty').style.display = 'block';
      });
    }
    el.appendChild(btn);
  });
}

function loadAndRenderRoute(key){
  const t = TERMINALS.find(x => x.key === key);
  if(!t || !t.file) return;
  clearMainLayers();
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('loading').textContent = `${t.label} 경로 불러오는 중…`;

  const afterLoad = (data) => {
    routeDataCache[key] = data;
    document.getElementById('loading').style.display = 'none';
    const counts = data.features.map(f => f.properties.count).filter(v => v != null);
    const bins = quantileBins(counts, ROUTE_RAMP.length);
    const minV = Math.min(...counts), maxV = Math.max(...counts);

    routeLayer = L.geoJSON(data, {
      style: (feature) => {
        const v = feature.properties.count;
        let idx = bins.findIndex(b => v <= b);
        if(idx === -1) idx = ROUTE_RAMP.length - 1;
        return { color: ROUTE_RAMP[idx], weight: 3 + idx * 1.3, opacity: 0.9 };
      },
      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        layer.bindPopup(`
          <div class="popup-road">${p.ROAD_NAME || '(도로명 없음)'}</div>
          <div class="popup-id">LINK_ID ${p.LINK_ID}</div>
          <div class="popup-grid">
            <div class="k">${t.label} 방향 통행량</div><div class="v hl">${Math.round(p.count).toLocaleString()}</div>
            <div class="k">도로 등급</div><div class="v">${ROAD_RANK_LABEL[p.ROAD_RANK] || p.ROAD_RANK || '-'}</div>
            <div class="k">차로 수</div><div class="v">${p.LANES != null ? p.LANES + '차로' : '-'}</div>
          </div>
        `);
      }
    }).addTo(map);

    const legendEl = document.getElementById('legend');
    legendEl.innerHTML = '';
    document.getElementById('legend-heading').textContent = `범례 · ${t.label} 통행량`;
    const edges = [minV, ...bins, maxV];
    ROUTE_RAMP.forEach((color, i) => {
      const row = document.createElement('div');
      row.className = 'legend-row';
      row.innerHTML = `<div class="swatch" style="background:${color}"></div><div>${Math.round(edges[i]).toLocaleString()} – ${Math.round(edges[i+1]).toLocaleString()} 대</div>`;
      legendEl.appendChild(row);
    });

    document.getElementById('stats').innerHTML = `
      <div class="stat-box"><div class="num">${data.features.length.toLocaleString()}</div><div class="lbl">${t.label} 경로 구간 수</div></div>
      <div class="stat-box"><div class="num">${Math.round(counts.reduce((s,v)=>s+v,0)).toLocaleString()}</div><div class="lbl">누적 통행량(대)</div></div>
    `;

    map.fitBounds(routeLayer.getBounds(), { padding: [30,30] });
  };

  if(routeDataCache[key]){ afterLoad(routeDataCache[key]); return; }
  fetch(t.file).then(r => r.json()).then(afterLoad).catch(err => {
    document.getElementById('loading').textContent = '경로 데이터를 불러오지 못했습니다: ' + err.message;
  });
}

function renderStats(){
  const fl = FIELDS[currentField];
  const sc = SCENARIOS[currentScenario];
  const k = `${sc.key}_${fl.key}`;
  const withStats = allFeatures.filter(f => f.properties[k] != null);
  const totalWeight = allFeatures.reduce((s,f) => s + (f.properties[`${sc.key}_sum_weight_kg`] || 0), 0);
  const totalVeh = allFeatures.reduce((s,f) => s + (f.properties[`${sc.key}_vehicle_count`] || 0), 0);
  const boxes = [
    { num: allFeatures.length.toLocaleString(), lbl: '전체 도로 구간' },
    { num: withStats.length.toLocaleString(), lbl: 'GPS 매칭 구간' },
    { num: Math.round(totalVeh).toLocaleString(), lbl: `${sc.label} 누적 교통량` },
    { num: Math.round(totalWeight/1000).toLocaleString() + ' t', lbl: `${sc.label} 누적 물동량` }
  ];
  document.getElementById('stats').innerHTML = boxes.map(b => `<div class="stat-box"><div class="num">${b.num}</div><div class="lbl">${b.lbl}</div></div>`).join('');
}

// stats should refresh whenever scenario/field changes too
const _renderLegendOrig = renderLegend;
function refreshAll(){ renderLegend(); renderStats(); renderLayer(); }

// rewire chip/button handlers to also refresh stats
function wireRefresh(){
  ['scenario-select','field-select','struct-select'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => setTimeout(renderStats, 0));
  });
}

fetch('./data.geojson')
  .then(r => r.json())
  .then(data => {
    allFeatures = data.features;
    computeAllBins();
    document.getElementById('loading').style.display = 'none';
    renderScenarioChips();
    renderFieldChips();
    renderStructButtons();
    renderTerminalChips();
    renderLegend();
    renderStats();
    renderLayer();
    wireRefresh();
    const bounds = L.geoJSON(data).getBounds();
    map.fitBounds(bounds, { padding: [30,30] });
  })
  .catch(err => {
    document.getElementById('loading').textContent = '데이터를 불러오지 못했습니다: ' + err.message;
  });
</script>
